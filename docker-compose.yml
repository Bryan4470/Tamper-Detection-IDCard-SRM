services:
  tamper-detection:
    build: .
    container_name: tamper-detection2
    shm_size: '8gb'
    ports:
      - "7588:7500"
    volumes:
      - .:/app
      # - /mnt/auto-ekyc:/mnt/auto-ekyc
      # - /mnt2/auto-ekyc/id_physical_tamper_new:/mnt2/auto-ekyc/id_physical_tamper_new
      # - /mnt2/raw_dataset/research/idv:/mnt2/raw_dataset/research/idv
      # - /mnt3/auto-ekyc/id_physical_tamper_new:/mnt3/auto-ekyc/id_physical_tamper_new
      # - /mnt3/tamper_data:/mnt3/tamper_data
      - /home/bryancfk/auto-ekyc/id_physical_tamper_new:/home/bryancfk/auto-ekyc/id_physical_tamper_new
      - /home/bryancfk/tamper_data:/home/bryancfk/tamper_data
    # environment:
    #   - MODEL_PATH=/mnt2/auto-ekyc/id_physical_tamper_new/_dual_stream/trained_model/tamper_with_color_space.pth
    #   - CONFIG_PATH=/app/configs/config.yaml
    #   - THRESHOLD=0.5
    command: tail -f /dev/null
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped
